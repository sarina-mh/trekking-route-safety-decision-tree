[project]
name = "trekking-route-safety-decision-tree"
version = "0.1.0"
description = "Decision tree classifier for mountain trekking route safety using environmental features"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
]
